name: Publish motion comic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/episodes/frozen-hollow _site/assets
          cp site/index.html _site/index.html
          cp dist/frozen-hollow.html _site/episodes/frozen-hollow/index.html
          cp assets/episodes/frozen-hollow/arrival-v4.png _site/assets/preview.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
